name: CI - Dynamic Engine + Smalltalk

on:
  push:
  pull_request:

jobs:
  macos-ci:
    runs-on: macos-latest
    strategy:
      matrix:
        smalltalk: [ Pharo64-12 ]
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show system info
        run: |
          uname -a
          uname -m
          gcc --version

      # ------------------------------
      # Step 1: Verify librariesBundle_mac
      # ------------------------------
      - name: Verify librariesBundle_mac layout
        run: |
          echo "📁 librariesBundle_mac contents:"
          ls -la librariesBundle_mac
          echo "📁 faustLibs contents:"
          ls -la librariesBundle_mac/faustLibs

          if [ ! -f "librariesBundle_mac/faustLibs/all.lib" ]; then
            echo "❌ Missing faustLibs/all.lib"
            exit 1
          fi

      # ------------------------------
      # Step 2: Inspect libdynamic-engine dependencies
      # ------------------------------
      - name: Inspect dynamic library dependencies
        run: |
          cd librariesBundle_mac
          echo "🔗 libdynamic-engine.dylib dependencies:"
          otool -L libdynamic-engine.dylib

      # ------------------------------
      # Step 3: Compile native test
      # ------------------------------
      - name: Compile native test
        run: |
          cd librariesBundle_mac
          gcc testDynamicEngine.c -o test_dynamic_engine -std=c11

      # ------------------------------
      # Step 4: Run native test
      # ------------------------------
      - name: Run native test
        run: |
          cd librariesBundle_mac
          export DYLD_LIBRARY_PATH="$PWD"
          export FAUST_DEBUG=1
          export FAUST_LIB_PATH="$PWD/faustLibs"
          ./test_dynamic_engine 2>&1 | tee faust.log

     
