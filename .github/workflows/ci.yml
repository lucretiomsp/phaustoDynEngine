name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - uses: actions/checkout@v4

      # 2. Install system dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ libasound2-dev libpulse-dev wget patchelf zip

      # 3. Build static libsndfile and dependencies
      - name: Build static libsndfile
        run: |
          mkdir -p $HOME/static-libs
          wget https://github.com/libsndfile/libsndfile/releases/download/1.2.2/libsndfile-1.2.2.tar.xz
          tar xf libsndfile-1.2.2.tar.xz
          cd libsndfile-1.2.2
          PKG_CONFIG_PATH=$HOME/static-libs/lib/pkgconfig ./configure --prefix=$HOME/static-libs --enable-static --disable-shared
          make -j$(nproc) && make install

      # 4. Build your library with Makefile
      - name: Build Dynamic Engine
        working-directory: builDynEng
        run: |
          export CPPFLAGS="-I$HOME/static-libs/include"
          export LDFLAGS="-L$HOME/static-libs/lib -static-libgcc -static-libstdc++"
          make LDFLAGS="$LDFLAGS" CPPFLAGS="$CPPFLAGS"

      # 5. Verify static linking
      - name: Check library dependencies
        run: |
          ldd librariesLinux/libdynamic-engine.so || true

      # 6. Run tests
      - name: Build and run test
        run: |
          g++ tests/test_dynamic_engine.cpp -LbuilDynEng/librariesLinux -ldynamic-engine -IbuilDynEng/architecture -o test_dynamic_engine
          LD_LIBRARY_PATH=builDynEng/librariesLinux ./test_dynamic_engine

      # 7. Upload artifacts
      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-engine
          path: builDynEng/librariesLinux/libdynamic-engine.so
