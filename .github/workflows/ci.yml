name: CI - Dynamic Engine + Smalltalk (Linux)

on:
  push:
  pull_request:

jobs:
  ubuntu-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show system info
        run: |
          uname -a
          uname -m
          gcc --version

      # ------------------------------
      # Step 1: Verify librariesBundle_Linux
      # ------------------------------
      - name: Verify librariesBundle_Linux layout
        run: |
          echo "📁 librariesBundle_Linux contents:"
          ls -la librariesBundle_Linux
          echo "📁 faustLibs contents:"
          ls -la librariesBundle_Linux/faustLibs

          if [ ! -f "librariesBundle_Linux/faustLibs/all.lib" ]; then
            echo "❌ Missing faustLibs/all.lib"
            exit 1
          fi

          if [ ! -f "librariesBundle_Linux/libdynamic-engine.so" ]; then
            echo "❌ Missing libdynamic-engine.so"
            exit 1
          fi

      # ------------------------------
      # Step 2: Inspect libdynamic-engine dependencies
      # ------------------------------
      - name: Inspect dynamic library dependencies
        run: |
          cd librariesBundle_Linux
          echo "🔗 libdynamic-engine.so dependencies:"
          ldd libdynamic-engine.so || true

      # ------------------------------
      # Step 3: Compile native test
      # ------------------------------
      - name: Compile native test
        run: |
          cd librariesBundle_Linux
          gcc testDynamicEngine.c -o test_dynamic_engine -std=c11

      # ------------------------------
      # Step 4: Run native test
      # ------------------------------
      - name: Run native test
        run: |
          cd librariesBundle_Linux
          export LD_LIBRARY_PATH="$PWD"
          export FAUST_DEBUG=1
          export FAUST_LIB_PATH="$PWD/faustLibs"
          ./test_dynamic_engine 2>&1 | tee faust.log
