name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - uses: actions/checkout@v4

      # 2. Install required system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            g++ \
            libpulse-dev \
            libpulse0

      # 3. Prepare build folder
      - name: Prepare build folder
        run: |
          mkdir -p build
          cp -a librariesBundle_Linux/. build/
          cp -a tests/. build/

      # 4. Fix .so symlinks
      - name: Fix library symlinks
        run: |
          cd build
          # libfaust
          if [ -f libfaust.so.2.0.0 ] && [ ! -L libfaust.so.2 ]; then
            ln -sf libfaust.so.2.0.0 libfaust.so.2
          fi
          # Verify symlinks
          ls -l libfaust.so* || true

      # 5. Verify .so files are valid
      - name: Verify shared libraries
        run: |
          cd build
          for lib in libfaust.so.2 libdynamic-engine.so; do
            if [ ! -s "$lib" ]; then
              echo "❌ $lib is empty or corrupted!"
              exit 1
            fi
          done

      # 6. Check library dependencies
      - name: Check library dependencies
        run: |
          cd build
          export LD_LIBRARY_PATH=$(pwd):$LD_LIBRARY_PATH
          ldd libdynamic-engine.so
          if ldd libdynamic-engine.so | grep -q "not found"; then
            echo "❌ Missing dependency detected!"
            exit 1
          else
            echo "✅ All dependencies found"
          fi

      # 7. Compile and run test program
      - name: Build and run test program
        run: |
          cd build
          g++ test_dynamic_engine.cpp -L. -ldynamic-engine -o test_dynamic_engine
          LD_LIBRARY_PATH=$(pwd):$LD_LIBRARY_PATH ./test_dynamic_engine

      # 8. Upload DynEngine libraries as artifact
      - name: Upload DynEngine libraries
        uses: actions/upload-artifact@v4
        with:
          name: dynengine-libs
          path: build/*.so
