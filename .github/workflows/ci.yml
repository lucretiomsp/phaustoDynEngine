name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            g++ \
            libasound2-dev \
            libpulse-dev \
            wget \
            patchelf \
            zip \
            libfaust-dev

      # 3. Build static libsndfile
      - name: Build static libsndfile
        run: |
          mkdir -p "$HOME/static-libs"
          wget https://github.com/libsndfile/libsndfile/releases/download/1.2.2/libsndfile-1.2.2.tar.xz
          tar xf libsndfile-1.2.2.tar.xz
          cd libsndfile-1.2.2
          PKG_CONFIG_PATH="$HOME/static-libs/lib/pkgconfig" \
          ./configure \
            --prefix="$HOME/static-libs" \
            --enable-static \
            --disable-shared
          make -j$(nproc)
          make install

      # 4. Build Dynamic Engine (Makefile is in build/)
      - name: Build Dynamic Engine
        working-directory: build
        run: |
          export CPPFLAGS="-I$HOME/static-libs/include"
          export LDFLAGS="-L$HOME/static-libs/lib -static-libgcc -static-libstdc++"
          make CPPFLAGS="$CPPFLAGS" LDFLAGS="$LDFLAGS"

      # 5. Verify library dependencies
      - name: Check shared library dependencies
        run: |
          ldd librarieBundle_Linux/libdynamic-engine.so || true

      # 6. Build and run tests
      - name: Build and run tests
        run: |
          g++ tests/test_dynamic_engine.cpp \
            -LlibrarieBundle_Linux \
            -ldynamic-engine \
            -Iarchitecture \
            -o test_dynamic_engine

          LD_LIBRARY_PATH=librarieBundle_Linux ./test_dynamic_engine

      # 7. Upload artifacts
      - name: Upload dynamic engine library
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-engine-linux
          path: librarieBundle_Linux/libdynamic-engine.so
